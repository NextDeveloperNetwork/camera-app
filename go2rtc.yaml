# go2rtc configuration for RTSP camera streaming
# Documentation: https://github.com/AlexxIT/go2rtc

api:
  listen: ":1984"
  origin: "*"

# Pre-configured RTSP cameras
streams:
  camera_channel_4:
    - "rtsp://192.168.1.10:554/user=admin&password=&channel=4&stream=0.sdp"
  camera_channel_3:
    - "rtsp://192.168.1.10:554/user=admin&password=&channel=3&stream=0.sdp"

webrtc:
  listen: ":8555"
  # WebRTC ICE servers for external Cloudflare/remote access
  candidates:
    - "stun:stun.l.google.com:19302"
