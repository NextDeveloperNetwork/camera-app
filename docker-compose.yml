services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cameraview-web
    restart: unless-stopped
    ports:
      - "7070:3000"
    environment:
      - NODE_ENV=production
      - MEDIAMTX_URL=http://stream-server:8888
      - PORT=3000
    depends_on:
      - stream-server

  stream-server:
    image: bluenviron/mediamtx:latest
    container_name: cameraview-mediamtx
    restart: unless-stopped
    ports:
      - "8888:8888"       # HLS stream server
    environment:
      - MTX_LOGLEVEL=info
      - MTX_HLSADDRESS=:8888
      - MTX_HLSALLOWORIGINS=*
      - MTX_HLSVARIANT=fmp4
      - MTX_HLSSEGMENTCOUNT=5
      - MTX_HLSSEGMENTDURATION=2s
      - MTX_WEBRTCADDRESS=:8889
      - MTX_SRTADDRESS=:8890
      - MTX_PATHDEFAULTS_RTSPTRANSPORT=tcp
      - MTX_PATHDEFAULTS_SOURCEONDEMAND=yes
      - MTX_PATHDEFAULTS_SOURCEONDEMANDSTARTTIMEOUT=15s
      - MTX_PATHDEFAULTS_SOURCEONDEMANDCLOSEAFTER=30s
      - MTX_PATHS_CAMERA_CHANNEL_1_SOURCE=rtsp://192.168.1.10:554/user=admin&password=&channel=1&stream=0.sdp
      - MTX_PATHS_CAMERA_CHANNEL_2_SOURCE=rtsp://192.168.1.10:554/user=admin&password=&channel=2&stream=0.sdp
      - MTX_PATHS_CAMERA_CHANNEL_3_SOURCE=rtsp://192.168.1.10:554/user=admin&password=&channel=3&stream=0.sdp
      - MTX_PATHS_CAMERA_CHANNEL_4_SOURCE=rtsp://192.168.1.10:554/user=admin&password=&channel=4&stream=0.sdp
      - MTX_PATHS_CAMERA_CHANNEL_1_SUB_SOURCE=rtsp://192.168.1.10:554/user=admin&password=&channel=1&stream=1.sdp
      - MTX_PATHS_CAMERA_CHANNEL_2_SUB_SOURCE=rtsp://192.168.1.10:554/user=admin&password=&channel=2&stream=1.sdp
      - MTX_PATHS_CAMERA_CHANNEL_3_SUB_SOURCE=rtsp://192.168.1.10:554/user=admin&password=&channel=3&stream=1.sdp
      - MTX_PATHS_CAMERA_CHANNEL_4_SUB_SOURCE=rtsp://192.168.1.10:554/user=admin&password=&channel=4&stream=1.sdp

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cameraview-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-eyJhIjoiZmNhOGY3OTUzOTdmZDk0NDFkYjA0NmI3ZDQ2ODRlMDUiLCJ0IjoiOGYzYmJlMzItZjg5My00Y2Q2LWFhMmEtOTA1M2I0ZjFhZTAyIiwicyI6IllXRm1PREE1TldZdFlUZGhNUzAwTVdGbExXSTNNV1V0WWpsak1qWm1ORGhtTlRrMSJ9}
    depends_on:
      - web
