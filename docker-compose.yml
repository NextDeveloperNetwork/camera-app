services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cameraview-web
    restart: unless-stopped
    ports:
      - "7070:3000"
    environment:
      - NODE_ENV=production
      - GO2RTC_URL=http://stream-server:1984
      - PORT=3000
    depends_on:
      - stream-server

  stream-server:
    image: alexxit/go2rtc:latest
    container_name: cameraview-go2rtc
    restart: unless-stopped
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro
    ports:
      - "1984:1984"       # Web UI, API, MSE, WebRTC HTTP
      - "8555:8555/tcp"   # WebRTC signaling
      - "8555:8555/udp"   # WebRTC media

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cameraview-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-eyJhIjoiZmNhOGY3OTUzOTdmZDk0NDFkYjA0NmI3ZDQ2ODRlMDUiLCJ0IjoiOGYzYmJlMzItZjg5My00Y2Q2LWFhMmEtOTA1M2I0ZjFhZTAyIiwicyI6IllXRm1PREE1TldZdFlUZGhNUzAwTVdGbExXSTNNV1V0WWpsak1qWm1ORGhtTlRrMSJ9}
    depends_on:
      - web
