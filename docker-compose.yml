services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cameraview-web
    restart: unless-stopped
    ports:
      - "7070:3000"
    environment:
      - NODE_ENV=production
      - MEDIAMTX_URL=http://stream-server:8888
      - PORT=3000
    depends_on:
      - stream-server

  stream-server:
    build:
      context: .
      dockerfile: Dockerfile.mediamtx
    container_name: cameraview-mediamtx
    restart: unless-stopped
    ports:
      - "8888:8888"       # HLS stream server

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cameraview-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN:-eyJhIjoiZmNhOGY3OTUzOTdmZDk0NDFkYjA0NmI3ZDQ2ODRlMDUiLCJ0IjoiOGYzYmJlMzItZjg5My00Y2Q2LWFhMmEtOTA1M2I0ZjFhZTAyIiwicyI6IllXRm1PREE1TldZdFlUZGhNUzAwTVdGbExXSTNNV1V0WWpsak1qWm1ORGhtTlRrMSJ9}
    depends_on:
      - web
